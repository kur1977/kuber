apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.api.name}}-deployment
spec:
  replicas: {{.Values.api.replicas}}
  selector:
    matchLabels:
      components: {{.Values.api.components}}
  template:
    metadata:
      labels:
        components: {{.Values.api.components}}
    spec:
      containers:
        - name: {{.Values.api.name}}
          image: {{.Values.api.image}}
          ports:
            - containerPort: {{.Values.api.port}}
          env:
            {{- range $key, $value := .Values.api.envs }}
            {{- $data := dict "name" $.Values.api.components "env" $key}}
            {{- include "env.template" $data | nindent 12 }}
            {{- end }}
          resources:
            limits: {{.Values.api.limits | toYaml | nindent 14}}
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - http://localhost:{{.Values.api.port}}/{{.Values.api.components}}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 1