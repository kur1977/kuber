apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.postgres.name}}-deployment
spec:
  replicas: {{.Values.postgres.replicas}}
  selector:
    matchLabels:
      components: {{.Values.postgres.components}}
  template:
    metadata:
      labels:
        components: {{.Values.postgres.components}}
    spec:
      containers:
        - name: {{.Values.postgres.name}}
          image: {{.Values.postgres.image}}
          ports:
            - containerPort: {{.Values.postgres.port}}
          env:
            {{- range $key, $value := .Values.postgres.envs }}
            {{- $data := dict "name" $.Values.postgres.components "env" $key}}
            {{- include "env.template" $data | nindent 12 }}
            {{- end }}
          resources:
            limits: {{.Values.postgres.limits | toYaml | nindent 14}}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{.Values.postgres.name}}-pvc